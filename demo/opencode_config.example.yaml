# intersoulligence demo work agent — opencode 配置示例
#
# 将 intersoulligence MCP server 注册为 opencode 的 tool provider。
# 用户在 opencode 中可直接调用 persona_layer0_get / persona_layer1_get /
# persona_layer2_query / persona_runtime_op / persona_get_system_prompt 五个 MCP 工具。

# 安装：
#   1. cd intersoulligence && uv sync --extra dev
#   2. cp demo/opencode_config.example.yaml ~/.config/opencode/opencode.json
#      或按 opencode 实际读取路径配置
#   3. 重启 opencode（或 reload config）

# opencode 配置schema 约 1.0；具体字段视 opencode 版本可能略有不同。
# 这里给出工具注册的典型形态：把 intersoulligence-server 脚本注册为 stdio MCP server。

version: "1.0"

# ---------------------------------------------------------------------------
# MCP servers 注册：intersoulligence 作为 stdio server
# ---------------------------------------------------------------------------
mcp_servers:
  intersoulligence:
    type: stdio
    command: uv
    args:
      - run
      - --directory
      - D:\GithubPlay\WorkSpace\.alice\intersoulligence
      - intersoulligence-server
    env:
      PERSONA_SCHEMA_PATH: ./data/persona_schema.yaml
      PERSONA_DB_PATH: ./data/persona.db
      PERSONA_SNAPSHOT_DIR: ./data/snapshots

# ---------------------------------------------------------------------------
# agent 配置：让对话 agent 加载人格模块
# ---------------------------------------------------------------------------
agents:
  grill_persona:
    name: 白艾莉
    model: claude-3-5-sonnet
    # system_prompt 不再写死人格声明——由人格模块强制组装并注入：
    # 启动时调用 persona_get_system_prompt 获取完整人格 system_prompt 并严格遵循。
    system_prompt: |
      启动时先调用 persona_get_system_prompt 获取完整人格声明，然后严格遵循。
      阶段切换 / 场景自检通过 persona_runtime_op 的 emit_stage_transition /
      emit_scenario_check 结构化输出发送，响应文本中不要出现任何协议标记字面量。
    tools:
      - intersoulligence.persona_layer0_get
      - intersoulligence.persona_layer1_get
      - intersoulligence.persona_layer2_query
      - intersoulligence.persona_runtime_op
      - intersoulligence.persona_get_system_prompt